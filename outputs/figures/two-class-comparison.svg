<svg xmlns="http://www.w3.org/2000/svg" width="960" height="515" viewBox="0 0 960 515" role="img" aria-labelledby="title desc"><title id="title">Two-class validation comparison</title><desc id="desc">Feature extraction 3 epochs: 18/29. Feature extraction 10 epochs: 27/29. Fine-tuning 10 epochs: 28/29.</desc><rect width="960" height="515" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="42" font-size="24" fill="#0f172a" >Two-class validation comparison</text><text x="36" y="70" font-size="15" fill="#334155" >Same two-class split · 113 training / 29 validation images · final-epoch scores</text><line x1="275" y1="125" x2="275" y2="395" stroke="#e2e8f0" /><text x="275" y="418" font-size="13" fill="#64748b" text-anchor="middle">0%</text><line x1="378" y1="125" x2="378" y2="395" stroke="#e2e8f0" /><text x="378" y="418" font-size="13" fill="#64748b" text-anchor="middle">20%</text><line x1="481" y1="125" x2="481" y2="395" stroke="#e2e8f0" /><text x="481" y="418" font-size="13" fill="#64748b" text-anchor="middle">40%</text><line x1="584" y1="125" x2="584" y2="395" stroke="#e2e8f0" /><text x="584" y="418" font-size="13" fill="#64748b" text-anchor="middle">60%</text><line x1="687" y1="125" x2="687" y2="395" stroke="#e2e8f0" /><text x="687" y="418" font-size="13" fill="#64748b" text-anchor="middle">80%</text><line x1="790" y1="125" x2="790" y2="395" stroke="#e2e8f0" /><text x="790" y="418" font-size="13" fill="#64748b" text-anchor="middle">100%</text><text x="257" y="178" font-size="14" fill="#334155" text-anchor="end">Feature extraction · 3 epochs</text><rect x="275" y="155" width="319.65517241379314" height="38" rx="4" fill="#2563eb"/><text x="606.6551724137931" y="179" font-size="15" fill="#334155" >18/29 (62.1%)</text><text x="257" y="269" font-size="14" fill="#334155" text-anchor="end">Feature extraction · 10 epochs</text><rect x="275" y="246" width="479.48275862068965" height="38" rx="4" fill="#2563eb"/><text x="766.4827586206897" y="270" font-size="15" fill="#334155" >27/29 (93.1%)</text><text x="257" y="360" font-size="14" fill="#334155" text-anchor="end">Full fine-tuning · 10 epochs</text><rect x="275" y="337" width="497.2413793103448" height="38" rx="4" fill="#0f766e"/><text x="784.2413793103449" y="361" font-size="15" fill="#334155" >28/29 (96.6%)</text><text x="36" y="465" font-size="14" fill="#64748b" >Fine-tuning scored one image higher than ten-epoch feature extraction. No independent test set.</text><text x="36" y="492" font-size="13" fill="#64748b" >Source: outputs/two_class/comparison.csv. Runs also used different learning rates.</text></g></svg>
